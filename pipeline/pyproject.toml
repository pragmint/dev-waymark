[project]
name = "waymark-pipeline"
version = "0.1.0"
description = "Extracts source systems into raw Parquet for Waymark"
requires-python = ">=3.12,<3.15"
dependencies = ["dlt[parquet,s3,az]>=1.31,<2", "duckdb>=1.3,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
